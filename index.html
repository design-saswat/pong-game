<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="scoreboard">
            <div class="score">
                <div class="score-label">Player</div>
                <div class="score-value" id="playerScore">0</div>
            </div>
            <div class="score">
                <div class="score-label">Computer</div>
                <div class="score-value" id="computerScore">0</div>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="paddle player-paddle" id="playerPaddle"></div>
            <div class="paddle computer-paddle" id="computerPaddle"></div>
            <div class="ball" id="ball"></div>
            <div class="net"></div>
            <div class="point-blip" id="pointBlip" aria-live="polite"></div>
            <div class="result-overlay" id="resultOverlay" aria-live="assertive">
                <div class="result-card" id="resultCard">WIN</div>
            </div>
            <div class="confetti-layer" id="confettiLayer"></div>
        </div>

        <div class="controls">
            <div class="settings-panel">
                <div class="setting-group">
                    <label for="difficultySlider">Difficulty <span id="difficultyLabel">3 - Medium</span></label>
                    <input type="range" id="difficultySlider" min="1" max="5" value="3">
                    <small>1 = easiest, 5 = hardest</small>
                </div>
                <div class="setting-group">
                    <label for="targetScoreSelect">Match length</label>
                    <select id="targetScoreSelect">
                        <option value="10">10 points</option>
                        <option value="20" selected>20 points</option>
                        <option value="30">30 points</option>
                    </select>
                    <small>Default match length is 20 points.</small>
                </div>
            </div>

            <p>Controls: Mouse Y or Arrow Keys ↑↓ to move the left paddle</p>
            <p id="statusMessage" class="status-message">Choose your difficulty and match length, then start the game.</p>
            <button id="startBtn" class="start-btn">Start Game</button>
            <button id="resetBtn" class="reset-btn">Reset Match</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
